{% extends 'layouts/blank.html' %}

{% block content %}

<wrapper class="block max-w-2xl mx-auto my-10 px-6">
    <div id="chat_window" class="h-[45rem] flex flex-col bg-pink-100 rounded-2xl shadow-2xl relative p-1 border border-pink-300">
        <div class="flex justify-center text-pink-600 bg-pink-200 p-2 sticky top-0 z-10 font-semibold rounded-t-2xl">
            Real-time Chat
        </div>
        <div id='chat_container' class="overflow-y-auto grow bg-pink-50 rounded-b-2xl p-4">
            <ul id='chat_messages' class="flex flex-col justify-end gap-2">
                {% for message in chat_messages reversed %}
                {% include 'a_rtchat/chat_message.html' %}
                {% endfor %}
            </ul>
        </div>
        <div class="sticky bottom-0 z-10 p-2 bg-pink-200 rounded-b-2xl">
            <div class="flex items-center rounded-xl bg-white px-2 py-2 shadow-md">
                <form id="chat_message_form" class="w-full"
                hx-post="{% url 'home' %}"
                hx-target="#chat_messages" 
                hx-swap="beforeend"
                _="on htmx:afterRequest reset() me">
                    {% csrf_token %}
                    {{ form }}
                </form>
            </div>
        </div>
    </div>
</wrapper>

{% endblock  %}

{% block javascript %}
<script>
    function scrollToBottom(){
        const container = document.getElementById('chat_container')
        container.scrollTop = container.scrollHeight;
    }
    scrollToBottom()
</script>
{% endblock %}
