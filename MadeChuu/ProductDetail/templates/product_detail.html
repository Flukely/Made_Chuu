<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 text-center">
                <img src="pic_trulli.jpg" alt="Product Image" class="img-fluid rounded">
            </div>
            <div class="col-md-6">
                <h2>{{product.product_name}}</h2>
                <h3>Made by {{product.shop.shop_name}}</h3>
                <div class="fs-4 fw-bold text-danger">{{product.price}}</div>
                <p class="text-muted">Category: {{product.category.category_name}}</p>
                <p class="text-muted">{{product.description}}</p>
                <div class="mt-3">
                    <label for="quantity" class="form-label">Quantity: {{product.quantity}}</label>
                    <div class="input-group w-50">
                        <button class="btn btn-outline-secondary" type="button">-</button>
                        <input type="text" class="form-control text-center" value="1">
                        <button class="btn btn-outline-secondary" type="button">+</button>
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button class="btn btn-primary btn-lg">Buy</button>
                    <button class="btn btn-outline-secondary btn-lg">Add to Cart</button>
                    <button class="btn btn-outline-dark btn-lg">♡</button>
                </div>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-12">
                <div class="border p-4 rounded">
                    <h3>Product Ratings</h3>
                    <div class="text-warning">★★★★★ 5/5</div>
                    <p class="text-muted">Filter by rating:</p>
                    <div class="d-flex gap-2 mb-3">
                        <button class="btn btn-outline-warning">5 ★</button>
                        <button class="btn btn-outline-warning">4 ★</button>
                        <button class="btn btn-outline-warning">3 ★</button>
                        <button class="btn btn-outline-warning">2 ★</button>
                        <button class="btn btn-outline-warning">1 ★</button>
                    </div>
                    <h4>Reviews</h4>
                    <ul class="list-group">
                        <li class="list-group-item">User 1: Great product!</li>
                        <li class="list-group-item">User 2: Loved it!</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
