<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยันการสั่งซื้อ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ปรับแต่งเล็กน้อยให้สวยงาม */
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #ffe6f2;
        }
        
        .container {
            max-width: 1000px;
            
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid #ff99cc;
        }

        .card-header {
            background-color: #ffccff;
            font-weight: bold;
        }

        .card img {
            border-radius: 8px;
        }

        .total-price {
            font-size: 1.5rem;
        }

        .btn-danger {
            border-radius: 25px;
            background-color: #ff66b2;
            border-color: #ff66b2;
        }

        .btn-checkout {
            width: 150px;
            background-color: #ff66b2;
            border-color: #ff66b2;
        }

        .top {
            margin-top: -25px;
        }

        .btn-back {
            background-color: #ff99cc;
            border-color: #ff99cc;
            color: white;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .btn-back:hover {
            background-color: #ff66b2;
            border-color: #ff66b2;
        }

        .header-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            border: 3px solid rgb(31, 7, 19);
        }

        .fixed-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            padding: 10px 20px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        .card-text{
            margin: 10px;
        }
    </style>
</head>

<body>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let cartItemsContainer = document.getElementById("cart-items");
            let totalPriceElement = document.getElementById("total-price");
            let orderBtn = document.getElementById("order-btn");

            let selectedItems = JSON.parse(localStorage.getItem("selectedCartItems"));  // ข้อมูลที่ถูกเก็บทั้งหมดอยู่นี้
            let totalPrice = 0;

            if (selectedItems && selectedItems.length > 0) {
                cartItemsContainer.innerHTML = ""; 
                selectedItems.forEach(item => {
                    let itemTotalPrice = parseFloat(item.price) * parseInt(item.quantity);
                    let itemHTML = `
                        <div class="card p-3 mb-4">
                            <div class="d-flex align-items-center">
                                <img src="${item.image}" class="rounded" alt="product" width="100">
                                <div class="ms-3">
                                    <h5>${item.name}</h5>
                                    <p class="text-muted">จำนวน: ${item.quantity}</p>
                                    <p class="text-danger fw-bold mb-0">฿${itemTotalPrice.toFixed(2)}</p>
                                </div>
                            </div>
                        </div>
                        <hr>
                    `;
                    cartItemsContainer.insertAdjacentHTML("beforeend", itemHTML);
                    totalPrice += itemTotalPrice;
                });

                totalPriceElement.innerText = "฿" + totalPrice.toFixed(2);
                orderBtn.classList.remove("disabled"); // เปิดปุ่ม "สั่งสินค้า"
            } else {
                cartItemsContainer.innerHTML = "<p class='text-center'>ไม่มีสินค้าที่เลือก</p>";
                orderBtn.classList.add("disabled"); // ปิดปุ่ม "สั่งสินค้า"
            }

            // เมื่อกดปุ่ม "สั่งสินค้า"
            orderBtn.addEventListener("click", function () {
                let orderData = {
                    items: selectedItems,
                    total_price: totalPrice
                };

                // เพิ่มการตั้งค่า CSRF token
                let csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

                fetch('/place_order/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify(orderData)
                })
                .then(() => {
                    alert("สั่งซื้อสำเร็จ! 🎉");
                    localStorage.removeItem("selectedCartItems"); // เคลียร์สินค้าใน localStorage

                    // ลบสินค้าที่เลือกในฐานข้อมูล 
                    fetch('/delete_cart_items/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken
                        },
                        body: JSON.stringify({ items: selectedItems })
                    })
                    .then(() => {
                        window.location.href = "/"; // กลับไปหน้าหลัก
                    })
                    .catch(() => {
                        window.location.href = "/"; // กลับไปหน้าหลัก
                    });
                })
                .catch(() => {
                    localStorage.removeItem("selectedCartItems"); // เคลียร์สินค้าใน localStorage
                    window.location.href = "/"; // กลับไปหน้าหลัก
                });
            });
        });
    </script>

    <div class="container py-5">
        <div class="header-container">
            <div class="d-flex justify-content-center align-items-center mb-3">
                <a href="javascript:history.back()" class="btn btn-back rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                    <i class="bi bi-arrow-left-circle"></i> 
                </a>
                <h3 class="fw-bold m-0 mx-auto">ยืนยันการสั่งซื้อ</h3>
            </div>
        </div>

        <div class="card p-3 mb-4" style="width: 100%; background-color: white; margin-top: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
            <div class="card-body">
                <h5 class="mb-3" style="font-weight: bold; color:rgb(243, 170, 34);">ที่อยู่จัดส่ง</h5>
                <div style="border: 2px solid #ff99cc; border-radius: 10px; padding: 15px;">
                    {% if detail_user %}
                        {% with user=detail_user.0 %}
                            <p class="card-text" style="margin: 5px 0; color: #333;">ชื่อ: <span style="font-weight: bold;">{{ user.user_name }}</span></p>
                            <p class="card-text" style="margin: 5px 0; color: #333;">ที่อยู่: <span style="font-weight: bold;">{{ user.address }}</span></p>
                            <p class="card-text" style="margin: 5px 0; color: #333;">เบอร์โทร: <span style="font-weight: bold;">{{ user.phone_num }}</span></p>
                        {% endwith %}
                    {% else %}
                        <p class="card-text" style="margin: 5px 0; color: #333;">ไม่มีข้อมูลผู้ใช้</p>
                    {% endif %}
                </div>
            </div>
        </div>

        <div class="container mt-4" id="cart-items" style="min-height: 100px;">
            <!-- สินค้าที่เลือกจะแสดงที่นี่ -->
        </div>
    </div>

    <!-- รวมและปุ่มสั่งสินค้า -->
    <div class="fixed-footer d-flex justify-content-between align-items-center">
        <div class="ms-auto">
            <span class="fw-bold me-2">รวม: <span id="total-price" class="total-price">฿0.00</span></span>
            <button id="order-btn" class="btn btn-danger disabled order-btn" >สั่งสินค้า</button>
        </div>
    </div>

    <!-- เพิ่ม CSRF token -->
    <form method="post" style="display: none;">
        {% csrf_token %}
    </form>

</body>

</html>
