<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ปรับแต่งเล็กน้อยให้สวยงาม */
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #ffe6f2;
        }
        
        .container {
            max-width: 1000px;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid #ff99cc;
        }

        .card-header {
            background-color:rgb(255, 196, 255);
            font-weight: bold;
        }

        .card img {
            border-radius: 8px;
        }

        .total-price {
            font-size: 1.5rem;
        }

        .btn-danger {
            border-radius: 25px;
            background-color: #ff66b2;
            border-color: #ff66b2;
        }

        .btn-checkout {
            width: 150px;
            background-color:rgb(194, 93, 144);
            border-color: #ff66b2;
        }

        .top {
            margin-top: -10px;
        }

        .header-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 3px solid rgb(31, 7, 19);
        }

        .fixed-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            padding: 10px 20px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="header-container">
            <h3 class="fw-bold text-center top">ตะกร้าสินค้า</h3>
        </div>

        <!-- แสดงสินค้าทั้งหมดในตะกร้า -->
        <div class="container mt-4">
            {% for Item in detail_cartitem %}
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            
                            <!-- เอาไว้เก็บข้อมูลสินค้าเพื่อใช้ในหน้าต่อไป นะเตง -->
                            <input type="checkbox" class="form-check-input me-2 item-checkbox" 
                                data-name="{{ Item.product.product_name }}" 
                                data-price="{{ Item.product.price }}" 
                                data-image="{{ Item.product.product_image.url }}" 
                                data-quantity="{{ Item.quantity }}"
                            >   
                            
                            <h5 class="m-0">{{ Item.product.product_name }}</h5>
                        </div>
                        <a href="{% url 'delete' Item.id %}" class="btn btn-danger ms-2">ลบ</a>
                    </div>
        
                    <div class="card-body d-flex align-items-center">
                        <img src="{{ Item.product.product_image.url }}" class="rounded" alt="product" width="120">
                        <div class="ms-3">
                            <p class="mb-1">{{ Item.product.product_name }}: {{ Item.product.description }}</p>
                            <small class="text-muted">จำนวน: {{ Item.quantity }}</small>
                            <p class="text-danger fw-bold mb-0">฿{{ Item.total_price }}</p>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
        

        <hr>
    </div>

    <!-- รวมและเลือกทั้งหมด -->
    <div class="fixed-footer d-flex justify-content-between align-items-center">
        <div>
            <input type="checkbox" id="select-all" class="form-check-input me-2">
            <label>เลือกทั้งหมด</label>
        </div>
        <div>
            <span class="fw-bold me-2">รวม: <span id="total-price" class="total-price">฿0.00</span></span>
            <a href="{% url 'Confirm_Cart' %}" id="checkout-btn" class="btn btn-danger disabled btn-checkout">ชำระเงิน</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const selectAllCheckbox = document.getElementById("select-all");
            const itemCheckboxes = document.querySelectorAll(".item-checkbox");
            const totalPriceElement = document.getElementById("total-price");
            const checkoutBtn = document.getElementById("checkout-btn");

            // ฟังก์ชันคำนวณราคารวม
            function updateTotal() {
                let total = 0;
                let hasSelectedItem = false;

                itemCheckboxes.forEach((checkbox) => {
                    if (checkbox.checked) {
                        // แปลงค่าราคาเป็นตัวเลขก่อนการคำนวณ
                        let price = parseFloat(checkbox.dataset.price) || 0; // แปลงเป็นตัวเลข
                        let quantity = parseInt(checkbox.dataset.quantity) || 0; // แปลงเป็นตัวเลข
                        total += price * quantity;
                        hasSelectedItem = true;
                    }
                });

                totalPriceElement.innerText = "฿" + total.toFixed(2); 
                checkoutBtn.classList.toggle("disabled", !hasSelectedItem);
            }

            // ฟังก์ชันเลือกทั้งหมด
            selectAllCheckbox.addEventListener("change", function () {
                itemCheckboxes.forEach((checkbox) => {
                    checkbox.checked = selectAllCheckbox.checked;
                });
                updateTotal();
            });

            // ฟังก์ชันเมื่อมีการเลือกสินค้า
            itemCheckboxes.forEach((checkbox) => {
                checkbox.addEventListener("change", updateTotal);
            });

            // ฟังก์ชันเมื่อกดปุ่มชำระเงิน
            checkoutBtn.addEventListener("click", function (event) {
                event.preventDefault(); // ป้องกันการเปลี่ยนหน้าโดยตรง

                let selectedItems = [];
                document.querySelectorAll(".item-checkbox:checked").forEach(checkbox => {
                    let item = {
                        id: checkbox.dataset.id,
                        name: checkbox.dataset.name,
                        price: checkbox.dataset.price,
                        image: checkbox.dataset.image,
                        quantity: checkbox.dataset.quantity
                    };
                    selectedItems.push(item);
                });

                localStorage.setItem("selectedCartItems", JSON.stringify(selectedItems));

                // ไปยังหน้าชำระเงิน
                window.location.href = '{% url 'Confirm_Cart' %}';
            });

            updateTotal();
        });
    </script>
</body>

</html>
