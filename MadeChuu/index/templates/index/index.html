<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Made Chuu - Products</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .banner {
            background-color: #EF8CB0;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .product-card img {
            height: 150px; /* ปรับขนาดความสูงของรูปภาพ */
            object-fit: cover;
        }

        .product-card {
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .navbar a.nav-link {
            color: white !important;
        }

        .navbar {
            background-color: #EF8CB0 !important;
        }

        /* เพิ่ม CSS สำหรับ footer */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            flex: 1;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #EF8CB0;
            color: white;
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg" style="background-color: #ffdae8; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="#" style="font-size: 1.5rem; text-transform: uppercase;">
                Made Chuu
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" style="color: white;"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold px-3" href="#" style="font-size: 1.1rem; transition: color 0.3s;">HOME</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-semibold px-3" href="#" id="shopDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 1.1rem; transition: color 0.3s;">
                            SHOP
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="shopDropdown" style="background-color: #FFD5E5; border: none; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                            <li><a class="dropdown-item fw-semibold" href="#" style="color: #EF8CB0;">Flowers</a></li>
                            <li><a class="dropdown-item fw-semibold" href="#" style="color: #EF8CB0;">Gifts</a></li>
                            <li><a class="dropdown-item fw-semibold" href="#" style="color: #EF8CB0;">Accessories</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold px-3" href="#" style="font-size: 1.1rem; transition: color 0.3s;">USER ACCESS</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Product Section -->
    <div class="container mt-5">
        <h2 class="text-muted fw-bold">KaJang&MomMan</h2>
        <div class="row">
            {% for product in products %}
            <div class="col-md-3">
                <div class="card product-card h-100 text-center">
                    <img src="{{ product.product_image.url }}" class="card-img-top" alt="{{ product.product_name }}">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">{{ product.product_name }}</h5>
                        <p class="card-text text-muted">{{ product.price }} ฿</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3">
        <p>© 2025 Made Chuu. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
