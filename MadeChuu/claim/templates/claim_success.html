{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำขอคืนสินค้าสำเร็จ</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fff5f8;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 550px;
            margin-top: 50px;
        }
        .card {
            border-radius: 15px;
            padding: 30px;
            background-color: #ffffff;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .success-icon {
            font-size: 60px;
            color: #ff66a3;
        }
        .btn-primary {
            background-color: #ff66a3;
            border: none;
            padding: 12px;
            font-size: 16px;
            width: 100%;
            color: white;
        }
        .btn-primary:hover {
            background-color: #e05592;
        }
        .btn-secondary {
            background-color: #d9d9d9;
            padding: 12px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="success-icon">✅</div>
        <h3 class="mt-3 text-success">ส่งคำขอสำเร็จ!</h3>
        <p class="text-muted">คำขอคืนเงิน/คืนสินค้าของคุณได้รับการบันทึกแล้ว 🎉</p>

        <p class="fw-bold">หมายเลขคำขอ: <span class="text-danger">#{{ claim.claim_id }}</span></p>
        <p class="text-muted">ทีมงานของเราจะตรวจสอบและติดต่อกลับภายใน 3-5 วันทำการ</p>
        <a href="/" class="btn btn-primary mt-3">กลับไปหน้าหลัก</a>
        <a href="{% url 'claim_status' claim_id=claim.claim_id %}" class="btn btn-secondary mt-2">ดูสถานะคำขอ</a>
    </div>
</div>

</body>
</html>
