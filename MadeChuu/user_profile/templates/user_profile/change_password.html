{% extends 'main/base.html' %}

{% block content %}
<div class="change-password-container" style="max-width: 600px; margin: 2rem auto; padding: 2rem; background-color: #fff8f8; border-radius: 20px; box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);">
    <h1 style="color: #ff85a2; text-align: center; margin-bottom: 2rem; font-weight: bold;">เปลี่ยนรหัสผ่าน</h1>
    
    <form method="post" style="background-color: white; padding: 2rem; border-radius: 15px; margin-bottom: 1rem; box-shadow: 0 2px 10px rgba(255, 182, 193, 0.2);">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="{{ field.id_for_label }}" style="color: #888; margin-bottom: 0.5rem; display: block;">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger" style="color: #ff6b6b; font-size: 0.9rem; margin-top: 0.3rem;">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}
        
        <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn" style="background-color: #ff85a2; color: white; border: none; border-radius: 50px; padding: 0.5rem 1.5rem; font-weight: 500; box-shadow: 0 2px 5px rgba(255, 133, 162, 0.3);">เปลี่ยนรหัสผ่าน</button>
            <a href="{% url 'user_profile:profile' %}" class="btn" style="background-color: #a2d6f9; color: white; border: none; border-radius: 50px; padding: 0.5rem 1.5rem; font-weight: 500; box-shadow: 0 2px 5px rgba(162, 214, 249, 0.3);">ยกเลิก</a>
        </div>
    </form>
</div>

<style>
    input {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ddd;
        border-radius: 10px;
        background-color: #fff;
        transition: all 0.3s;
    }
    
    input:focus {
        border-color: #ff85a2;
        box-shadow: 0 0 0 0.2rem rgba(255, 133, 162, 0.25);
        outline: none;
    }
</style>
{% endblock %}
