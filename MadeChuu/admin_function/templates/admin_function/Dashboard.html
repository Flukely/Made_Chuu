{% extends 'base.html' %}
{% load static %}
{% block title %} Dashboard {% endblock %}
{% block content %}
<div class="container mt-5">
  <h1 class="text-center text-primary">Dashboard</h1>
  <p class="text-center text-muted">กราฟ และข้อมูลการสั่งซื้อของลูกค้า</p>
  <div class="row g-3">
    <div class="col-md-3">
        <div class="card p-3">Card 1</div>
    </div>
    <div class="col-md-3">
        <div class="card p-3">Card 2</div>
    </div>
    <div class="col-md-3">
        <div class="card p-3">Card 3</div>
    </div>
    <div class="col-md-3">
        <div class="card p-3">Card 4</div>
    </div>
</div>

<!-- Bottom Row: 2 Large Cards -->
<div class="row g-3 mt-3">
    <div class="col-md-8">
        <canvas id="myChart1"></canvas>
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        var ctx = document.getElementById('myChart1').getContext('2d');
        var myChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
            datasets: [{
              label: '# of products',
              data: [12, 19, 3, 5, 2, 3],
              backgroundColor: [
              'rgba(255, 99, 132, 0.6)',
              'rgba(255, 159, 64, 0.6)',
              'rgba(255, 205, 86, 0.6)',
              'rgba(75, 192, 192, 0.6)',
              'rgba(54, 162, 235, 0.6)',
              'rgba(153, 102, 255, 0.6)',
              'rgba(201, 203, 207, 0.6)'
            ],
              borderWidth: 1
            }]
          },
          options: {
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });
      });
    </script>
    </div>
    <div class="col-md-4">
        <div class="card p-4">Large Card 2</div>
    </div>
</div>
    
  </div>
  
{% endblock%}
