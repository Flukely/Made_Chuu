{% extends 'base.html' %}
{% load static %}
{% block title %} แก้ไขสินค้า {% endblock %}

{% block content %}
<style>
    .pink-theme {
        --primary-color: #ff6b9d;
        --secondary-color: #ffc0d5;
        --light-pink: #ffe5ec;
        --dark-pink: #d6346a;
    }
    
    .pink-bg {
        background-color: var(--light-pink);
    }
    
    .pink-header {
        background-color: var(--primary-color);
        color: white;
    }
    
    .pink-btn {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
        color: white;
    }
    
    .pink-btn:hover {
        background-color: var(--dark-pink);
        border-color: var(--dark-pink);
    }
    
    .pink-border {
        border-color: var(--secondary-color);
    }
    
    .pink-focus:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 0.25rem rgba(255, 107, 157, 0.25);
    }
</style>

<div class="container pink-theme">
    <div class="row justify-content-center mt-5">
        <div class="col-lg-8">
            <div class="card pink-border shadow-sm">
                <div class="card-header pink-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">
                            <i class="fas fa-edit me-2"></i>แก้ไขสินค้า
                        </h4>
                        <a href="{% url 'ProductsAdmin' %}" class="btn btn-sm btn-light">
                            <i class="fas fa-times"></i>
                        </a>
                    </div>
                </div>
                
                <div class="card-body pink-bg">
                    <form id="edit-products-form" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <input type="hidden" name="product_id" value="{{ product.product_id }}">
                        
                        <!-- รูปภาพสินค้า -->
                        <div class="text-center mb-4">
                            <div class="position-relative d-inline-block">
                                {% if product.product_image %}
                                    <img src="{{ product.product_image.url }}" 
                                         class="img-thumbnail rounded-circle border-pink" 
                                         style="width: 200px; height: 200px; object-fit: cover;">
                                {% else %}
                                    <img src="{% static 'MadeChuu/images/default.png' %}" 
                                         class="img-thumbnail rounded-circle border-pink" 
                                         style="width: 200px; height: 200px; object-fit: cover;">
                                {% endif %}
                                <label class="d-block mt-2 text-pink fw-bold">
                                    <i class="fas fa-image me-1"></i>รูปภาพสินค้า
                                </label>
                            </div>
                        </div>
                        
                        <!-- ชื่อสินค้า -->
                        <div class="mb-4">
                            <label for="product_name" class="form-label text-pink fw-bold">
                                <i class="fas fa-tag me-1"></i>ชื่อสินค้า
                            </label>
                            <input type="text" name="product_name" class="form-control pink-focus" 
                                   id="product_name" value="{{ form.product_name.value }}" required
                                   placeholder="กรอกชื่อสินค้า">
                        </div>
                        
                        <!-- หมวดหมู่ -->
                        <div class="mb-4">
                            <label for="category" class="form-label text-pink fw-bold">
                                <i class="fas fa-list me-1"></i>หมวดหมู่
                            </label>
                            <select class="form-select pink-focus" name="category" id="category" required>
                                {% for category in form.category.field.queryset %}
                                    <option value="{{ category.category_id }}" 
                                        {% if category.category_id == form.category.value %}selected{% endif %}>
                                        {{ category.category_name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="row">
                            <!-- ราคา -->
                            <div class="col-md-6 mb-4">
                                <label for="price" class="form-label text-pink fw-bold">
                                    <i class="fas fa-money-bill-wave me-1"></i>ราคา
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-pink text-white">฿</span>
                                    <input type="number" step="0.01" name="price" 
                                           class="form-control pink-focus" id="price" 
                                           value="{{ form.price.value }}" required
                                           placeholder="0.00">
                                </div>
                            </div>
                            
                            <!-- จำนวน -->
                            <div class="col-md-6 mb-4">
                                <label for="quantity" class="form-label text-pink fw-bold">
                                    <i class="fas fa-boxes me-1"></i>จำนวนในสต็อก
                                </label>
                                <input type="number" name="quantity" class="form-control pink-focus" 
                                       id="quantity" value="{{ form.quantity.value }}" required
                                       placeholder="0">
                            </div>
                        </div>
                        
                        <!-- อัพโหลดรูปใหม่ -->
                        <div class="mb-4">
                            <label for="product_image" class="form-label text-pink fw-bold">
                                <i class="fas fa-camera me-1"></i>อัพโหลดรูปภาพใหม่
                            </label>
                            <input class="form-control image-input pink-focus" type="file" 
                                   name="product_image" accept="image/*">
                            <div class="text-center mt-3">
                                <img class="preview-img img-thumbnail rounded-circle" 
                                     style="width: 150px; height: 150px; object-fit: cover; display: none;">
                            </div>
                        </div>
                        
                        <!-- ปุ่มบันทึก -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn pink-btn btn-lg">
                                <i class="fas fa-save me-2"></i>บันทึกการเปลี่ยนแปลง
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Image preview functionality
    document.querySelector('.image-input').addEventListener('change', function(event) {
        const preview = document.querySelector('.preview-img');
        if (event.target.files && event.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(event.target.files[0]);
        }
    });

    // เพิ่มเอฟเฟกต์เมื่อโฟกัสที่ input
    document.querySelectorAll('.form-control, .form-select').forEach(el => {
        el.addEventListener('focus', function() {
            this.classList.add('shadow-sm');
        });
        el.addEventListener('blur', function() {
            this.classList.remove('shadow-sm');
        });
    });
</script>
{% endblock %}
