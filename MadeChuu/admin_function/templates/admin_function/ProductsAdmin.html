{% extends 'base.html' %}
{% load static %}
{% block title %} Product {% endblock %}
{% block content %}
  <!-- Page Header Start -->
  <div class="container-fluid page-header py-5 mb-5">
    <div class="container py-5">
        <h1 class="display-3 mb-3 animated slideInDown">Products</h1>
        <h5 class="mb-3 animated slideInDown">มีสินค้าใหม่ใช่ไหม ลงขายเลย</h5>
            <nav aria-label="breadcrumb animated slideInDown">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a class="" href="">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Products</li>
                </ol>
            </nav>
        </div>
    </div>
    <!-- Page Header End-->

<div class="container-xxl py-5">
    <div class="container">
        <div class="section-title text-start">
            <h1 class="display-6 mb-3">Products</h1>
        </div>
        <div class="checkProduct mb-5">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" checked>
                <label class="form-check-label Checkthings" for="flexCheckDefault">
                    Flower
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked" checked>
                <label class="form-check-label Checkthings" for="flexCheckChecked">
                    Accessorie
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" checked>
                <label class="form-check-label Checkthings" for="flexCheckDefault">
                    Keychain
                </label>
            </div>
        </div>
        
        
        <div class="row g-4">
                <div class="col-lg-3 col-md-6 wow fadeInUp">
                    <div class="team-item">
                        <div class="overflow-hidden position-relative rounded-3">
                            <img class="img-fluid" src="img/flower/page-1/product-6.png" >
                        </div>
                        <div class="text-center p-4">
                            <h5 class="mb-0">123456 : Product_1</h5>
                            <small>Flower</small><br>
                            <small>199 ฿</small><br>
                            <small>in Stock : 10</small>
                            
                            <br><br>
                            <div class="button-edit-delete">
                                <button class='btn btn-warning btn-radius10' type='button' data-bs-toggle="modal" data-bs-target="#editProductModal"> 
                                    <i class='fa-solid fa-wrench'></i>
                                </button>
                                <button class='btn btn-danger btn-radius10' type='button' onclick="confirmDelete()">
                                    <i class='fa-solid fa-trash-can'></i>
                                </button>
                            </div>
                        </div>
                        
                    </div>
                </div>
                <!-- Add product Button-->
                <div class="col-lg-3 col-md-6 wow fadeInUp">
                        <div class="team-item addproductthing add-product" data-bs-toggle="modal"
                        data-bs-target="#addProductModal">
                            <div class="overflow-hidden position-relative rounded-3">
                                <img class="img-fluid p-4" src="{% static 'MadeChuu/images/add.png' %}">
                            </div>
                            <div class="text-center p-4">
                                <h5 class="mb-0">Add Products </h5>
                                <h4 class="mb-0">Here </h4>
                                
                                <br><br>
                            </div>
                        </div>
                </div>

        </div>
    </div>
</div>
{% endblock %}
